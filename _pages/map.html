<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ '/assets/css/map.css' | relative_url }}">

<div class="header">
    <h1>SF MUNI Live Tracker</h1>
    <div class="live-indicator">
        <div class="pulse"></div>
        <span id="update-time">Loading...</span>
    </div>
</div>

<div class="container">
    <div id="map"></div>
    
    <div class="sidebar">
        <div class="filter-section">
            <label for="rid">Filter Routes</label>
            <div class="filter-controls">
                <input type="text" id="rid" placeholder="1, 5, 38R, N, ...">
                <div class="button-row">
                    <button class="btn btn-primary" id="apply-btn">Apply</button>
                    <button class="btn btn-secondary" id="clear-btn">Clear</button>
                </div>
                <button class="btn btn-stops" id="toggle-stops-btn">Show Stops</button>
            </div>
        </div>
        
        <div class="stats-mini">
            <div class="stat-mini">
                <div class="stat-mini-value" id="bus-count">0</div>
                <div class="stat-mini-label">Buses</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-value" id="route-count">0</div>
                <div class="stat-mini-label">Routes</div>
            </div>
        </div>
        
        <div class="route-list"></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<!-- Custom JS -->
<script src="{{ '/assets/js/map.js' | relative_url }}"></script>
