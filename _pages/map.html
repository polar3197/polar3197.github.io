<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<style>
  #map {
    height: 600px;
    width: 100%;
    margin-top: 1em;
  }

  .vehicle-label {
    background: white;
    border: 1px solid gray;
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 12px;
    white-space: nowrap;
  }
</style>

<div id="map"></div>

<script>
  const map = L.map('map').setView([37.7749, -122.4194], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function getOccupancyColor(vehicle) {
    switch (vehicle.occupancy_status) {
      case 0:
        return "lightblue";
      case 1:
        return "lightgreen";
      case 2:
        return "yellow";
      case 3:
        return "lightcoral"; // or "lightred" if you have a custom color
      default:
        console.log(vehicle.route_id, vehicle.occupancy_status);
        return "lightgray";  // fallback for undefined or unexpected values
    }
  }

  let vehicleMarkers = [];

  function updateVehicles() {
    // Remove existing markers from the map
    vehicleMarkers.forEach(marker => map.removeLayer(marker));
    // Clear the array so it only contains current markers
    vehicleMarkers = [];

    fetch("https://968885fb556c.ngrok-free.app/hot-data", {
      headers: {
        "ngrok-skip-browser-warning": "true"
      }
    })
      .then(response => response.json())
      .then(data => {
        data.forEach(vehicle => {
          if (!vehicle.route_id) return;
          const color = getOccupancyColor(vehicle);

          // Create a marker and add to the map
          const labelIcon = L.divIcon({
            className: 'vehicle-label',
            html: `<div style="background-color:${color}; padding: 2px 4px; border-radius: 4px;">${vehicle.route_id || 'OOS'}</div>`,
            iconSize: null
          });
          const marker = L.marker([vehicle.latitude, vehicle.longitude], { icon: labelIcon }).addTo(map);
          vehicleMarkers.push(marker);
          // const marker = L.marker([vehicle.latitude, vehicle.longitude])
          //   .addTo(map)
          //   .bindTooltip(vehicle.route_id || "No Route", {
          //     permanent: true,
          //     direction: "top",
          //     offset: [0, -10]
          //   })
          //   .openTooltip();
            // .addTo(map)
            // .bindPopup("Vehicle " + vehicle.vehicle_id);

          // Store the marker so we can remove it next update
          //vehicleMarkers.push(marker);
        });
      })
      .catch(error => console.error("Error fetching data:", error));
  }

  let pollInterval;

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(pollInterval);
    } else {
      updateVehicles();  // optional immediate update
      pollInterval = setInterval(updateVehicles, 30000);
    }
  });

  // Start polling on load
  updateVehicles();
  pollInterval = setInterval(updateVehicles, 30000);
</script>
