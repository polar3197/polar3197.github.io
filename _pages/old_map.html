      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
</script>

<style>
  h1.page-title {
      display: none;
  }

  #map {
      height: 600px;
      width: 900px;
      margin-top: 1em;
  }

  .vehicle-label {
      background: white;
      border: 1px solid gray;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 12px;
      white-space: nowrap;
  }

  .legend {
      background: white;
      padding: 5px;
      line-height: 10px;
      color: #333;
      font-size: 12px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      border-radius: 5px;
  }
</style>

<h2 style="text-align: center; margin-bottom: 0.5em;">
  SFMTA MUNI Busses - Live to 60s
</h2>

<form>
  <div>
    <label for="rid">show route(s)</label>
    <input type="text" id="rid" name="rid_list" placeholder="1, 5, 38R, N, ...">
  </div>
  <div>
    <input type="submit" value="submit" onclick="applyRouteFilter(); return false">
    <input type="reset" value="show all" onclick="clearFilters(); return false">
  </div>
</form>

<div id="map"></div>

<script>
  const map = L.map('map').setView([37.7749, -122.447], 12.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    // attribution is just giving credit to the source
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // create legend ========
  const legend = L.control({ position: 'topright' });  // or 'topright', etc.

  legend.onAdd = function (map) {
    const div = L.DomUtil.create('div', 'info legend');

    const labels = [
      { color: 'lightblue', label: 'Empty' },
      { color: 'lightgreen', label: 'Few Riders' },
      { color: 'yellow', label: 'Several Riders' },
      { color: 'lightcoral', label: 'Many Riders' },
    ];

    div.innerHTML = labels.map(item => {
      return `<div><span style="background:${item.color}; width: 16px; height: 16px; display:inline-block; margin-right:5px; border:1px solid #ccc;"></span>${item.label}</div>`;
    }).join('');

    return div;
  };
  // ========================

  legend.addTo(map);

  function getOccupancyColor(vehicle) {
    switch (vehicle.occupancy) {
      case 0:
        return "lightblue";
      case 1:
        return "lightgreen";
      case 2:
        return "yellow";
      case 3:
        return "lightcoral";
      default:
        console.log(vehicle.route_id, vehicle.occupancy);
        return "lightgray";  // fallback for undefined or unexpected values
    }
  }

  let vehicleMarkers = [];

  function updateVehicles() {
    // Remove existing markers from the map
    vehicleMarkers.forEach(marker => map.removeLayer(marker));
    // Clear the array so it only contains current markers
    vehicleMarkers = [];

    fetch("https://968885fb556c.ngrok-free.app/hot-data", {
      headers: {
        "ngrok-skip-browser-warning": "true"
      }
    })
      .then(response => response.json())
      .then(data => {
        data.forEach(vehicle => {
          if (!vehicle.route_id) return;

          // Apply filtering if enabled
          if (filtered && filtered_route_ids.length > 0) {
            if (!filtered_route_ids.includes(String(vehicle.route_id))) {
              return; // Skip this vehicle
            }
          }

          const color = getOccupancyColor(vehicle);

          // Create a marker and add to the map
          const labelIcon = L.divIcon({
            className: 'vehicle-label',
            html: `<div style="background-color:${color}; padding: 2px 4px; border-radius: 4px;">${vehicle.route_id || 'OOS'}</div>`,
            iconSize: null
          });
          const marker = L.marker([vehicle.lat, vehicle.lon], { icon: labelIcon }).addTo(map);
          vehicleMarkers.push(marker);
        });
      })
      .catch(error => console.error("Error fetching data:", error));
  }

  // ====== Filter Functions ======
  function applyRouteFilter() {
    const input = document.getElementById('rid').value.trim(); // Changed to 'rid'
    
    if (!input) {
      // Clear filter if input is empty
      filtered = false;
      filtered_route_ids = [];
    } else {
      // Parse comma-separated values
      const routeNumbers = input.split(',')
        .map(num => num.trim())
        .filter(num => num !== '');
      
      if (routeNumbers.length > 0) {
        filtered = true;
        filtered_route_ids = routeNumbers;
        console.log('Filtering enabled for routes:', filtered_route_ids);
      }
    }
    
    // Update the map immediately
    updateVehicles();
  }

  function clearFilters() { // Added 's' to match your function name
    filtered = false;
    filtered_route_ids = [];
    document.getElementById('rid').value = '';
    updateVehicles();
  }

  let pollInterval;

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(pollInterval);
    } else {
      updateVehicles();  // optional immediate update
      pollInterval = setInterval(updateVehicles, 30000);
    }
  });

  // Start polling on load
  updateVehicles();
  pollInterval = setInterval(updateVehicles, 30000);
</script>

<div style="height: 12em;"></div>
