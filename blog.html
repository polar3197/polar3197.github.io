---
title: Blog
permalink: /blog/
---
<h1>Blog</h1>
{% for post in site.posts %}
<section>
  <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
  <p><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time> — {{ post.description }}</p>
</section>
{% endfor %}
