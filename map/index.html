adow:0 0 5px rgba(0,0,0,0.3);border-radius:5px}</style> <h2 style="text-align: center; margin-bottom: 0.5em;"> SFMTA MUNI Busses - Live to 60s </h2> <div id="map"></div> <script>
  const map = L.map('map').setView([37.7749, -122.4194], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // create legend ========
  const legend = L.control({ position: 'topright' });  // or 'topright', etc.

  legend.onAdd = function (map) {
    const div = L.DomUtil.create('div', 'info legend');

    const labels = [
      { color: 'lightblue', label: 'Empty' },
      { color: 'lightgreen', label: 'Few Riders' },
      { color: 'yellow', label: 'Several Riders' },
      { color: 'lightcoral', label: 'Many Riders' },
    ];

    div.innerHTML = labels.map(item => {
      return `<div><span style="background:${item.color}; width: 16px; height: 16px; display:inline-block; margin-right:5px; border:1px solid #ccc;"></span>${item.label}</div>`;
    }).join('');

    return div;
  };
  // ========================

legend.addTo(map);

  function getOccupancyColor(vehicle) {
    switch (vehicle.occupancy) {
      case 0:
        return "lightblue";
      case 1:
        return "lightgreen";
      case 2:
        return "yellow";
      case 3:
        return "lightcoral"; // or "lightred" if you have a custom color
      default:
        console.log(vehicle.route_id, vehicle.occupancy);
        return "lightgray";  // fallback for undefined or unexpected values
    }
  }

  let vehicleMarkers = [];

  function updateVehicles() {
    // Remove existing markers from the map
    vehicleMarkers.forEach(marker => map.removeLayer(marker));
    // Clear the array so it only contains current markers
    vehicleMarkers = [];

    fetch("https://968885fb556c.ngrok-free.app/hot-data", {
      headers: {
        "ngrok-skip-browser-warning": "true"
      }
    })
      .then(response => response.json())
      .then(data => {
        data.forEach(vehicle => {
          if (!vehicle.route_id) return;
          const color = getOccupancyColor(vehicle);

          // Create a marker and add to the map
          const labelIcon = L.divIcon({
            className: 'vehicle-label',
            html: `<div style="background-color:${color}; padding: 2px 4px; border-radius: 4px;">${vehicle.route_id || 'OOS'}</div>`,
            iconSize: null
          });
          const marker = L.marker([vehicle.lat, vehicle.lon], { icon: labelIcon }).addTo(map);
          vehicleMarkers.push(marker);
        });
      })
      .catch(error => console.error("Error fetching data:", error));
  }

  let pollInterval;

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(pollInterval);
    } else {
      updateVehicles();  // optional immediate update
      pollInterval = setInterval(updateVehicles, 30000);
    }
  });

  // Start polling on load
  updateVehicles();
  pollInterval = setInterval(updateVehicles, 30000);
</script> <div style="height: 12em;"></div> </article> </div> </div> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/assets/js/copy_code.js?12775fdf7f95e901d7119054556e495f" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/assets/js/mathjax-setup.js?a5bb4e6a542c546dd929b24b8b236dfd"></script> <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=
